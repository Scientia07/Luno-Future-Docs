# ==============================================================================
# Manim Configuration File
# ==============================================================================
# filename:       manim.cfg
# created:        2026-01-27
# description:    Default settings for LunoLabs Manim animations
# ==============================================================================

[CLI]
# Default output directory
media_dir = ./media

# Default quality (l=low, m=medium, h=high, k=4K)
quality = h

# Preview after render
preview = True

# Output format
format = mp4

# Frame rate
frame_rate = 60

[logger]
# Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level = WARNING

[output]
# Save last frame as image
save_last_frame = False

# Save individual frames as PNGs
write_to_movie = True

[video]
# Pixel dimensions for each quality level
# Override with -r flag: manim -r 1920,1080

# 4K resolution
fourk_pixel_height = 2160
fourk_pixel_width = 3840

# 1080p resolution (default high quality)
production_pixel_height = 1080
production_pixel_width = 1920

# 720p resolution (medium quality)
medium_pixel_height = 720
medium_pixel_width = 1280

# 480p resolution (low quality/preview)
low_pixel_height = 480
low_pixel_width = 854

[tex]
# LaTeX template (standard or threeb1b)
tex_template = standard

# LaTeX compiler
tex_compiler = latex

[style]
# Background color (hex)
background_color = #0f172a

# Default animation run time
default_animation_run_time = 1.0
